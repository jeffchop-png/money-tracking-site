services:
  - type: web
    name: morg-money
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: morg-money-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: MORG_MONEY_KEY
        generateValue: true
      - key: MORG_MONEY_DATA_DIR
        value: /var/data